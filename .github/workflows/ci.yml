name: CI - scan & prepare

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    name: Secret scanning (basic)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Basic grep for disallowed patterns
        run: |
          set -e
          # Patterns that must not be committed. Adjust as needed.
          patterns=("service_role" "PRIVATE_KEY" "SECRET_KEY" "ANON_KEY" "SUPABASE_SERVICE_ROLE" "PASSWORD=" "TOKEN=")
          found=false
          for p in "${patterns[@]}"; do
            if git grep -n -- "${p}" >/dev/null 2>&1; then
              echo "Found prohibited pattern: ${p}"
              git grep -n -- "${p}"
              found=true
            fi
          done
          if [ "$found" = true ]; then
            echo "Secret scan failed — remove secrets before pushing." >&2
            exit 1
          fi

  build:
    name: Prepare static build (placeholder)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install (if you use a JS toolchain)
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build || true
          else
            echo "No package.json found — skipping build"
          fi

  deploy-placeholder:
    name: Deploy (placeholder)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare artifact for deployment
        run: |
          # Replace this with your actual build output path
          mkdir -p public
          cp -r index.html public/ || true

      - name: Note about deployment
        run: |
          echo "Deployment step is a placeholder. Configure a deployment action (Netlify, Vercel, or GitHub Pages) and set required secrets in Settings → Secrets and variables."

